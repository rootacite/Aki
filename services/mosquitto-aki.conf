# Aki local MQTT broker.
# Install as /etc/mosquitto/conf.d/aki.conf and make sure
# /etc/mosquitto/mosquitto.conf contains:
#   include_dir /etc/mosquitto/conf.d
#
# Local agents use 127.0.0.1:1883. LAN/WireGuard clients use the host's
# LAN or WireGuard address on the same port.
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300
max_queued_messages 1000
max_inflight_messages 20
log_dest syslog
log_type error
log_type warning
log_type notice
connection_messages true
